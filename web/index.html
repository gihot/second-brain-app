<!DOCTYPE html>
<html>
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="A new Flutter project.">
  <!-- Don't let iOS PWA cache the HTML entry point indefinitely -->
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
  <meta http-equiv="Pragma" content="no-cache">
  <meta http-equiv="Expires" content="0">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="second_brain">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>second_brain</title>
  <link rel="manifest" href="manifest.json">
</head>
<body>
  <!--
    You can customize the "flutter_bootstrap.js" script.
    This is useful to provide a custom configuration to the Flutter loader
    or to give the user feedback during the initialization process.

    For more details:
    * https://docs.flutter.dev/platform-integration/web/initialization
  -->
  <script src="flutter_bootstrap.js" async></script>
  <script>
    // Register the Brain service worker (Web Push) alongside Flutter's own SW.
    // WICHTIG: eigener Sub-Scope, damit es NICHT mit Flutters Root-Scope-SW
    // (Offline-Cache + Cache-Buster unten) kollidiert. Push-Delivery hängt
    // an der Registration, nicht am Scope.
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker
        .register('brain_sw.js', { scope: './push/' })
        .then(function (reg) { window.__sbPushReg = reg; })
        .catch(function () {});

      // ── Push-Helper, von Dart (notification_service_web) aufgerufen ──
      window.sbPush = {
        isSupported: function () {
          return (
            'serviceWorker' in navigator &&
            'PushManager' in window &&
            'Notification' in window
          );
        },
        permission: function () {
          try { return Notification.permission; } catch (e) { return 'denied'; }
        },
        requestPermission: function () {
          return Notification.requestPermission();
        },
        _reg: function () {
          // Auf unsere Sub-Scope-Registration warten (kann nach Boot
          // kurz noch nicht da sein).
          if (window.__sbPushReg) return Promise.resolve(window.__sbPushReg);
          return navigator.serviceWorker.register('brain_sw.js', { scope: './push/' });
        },
        _urlB64ToUint8Array: function (base64) {
          const padding = '='.repeat((4 - (base64.length % 4)) % 4);
          const b64 = (base64 + padding).replace(/-/g, '+').replace(/_/g, '/');
          const raw = atob(b64);
          const arr = new Uint8Array(raw.length);
          for (let i = 0; i < raw.length; i++) arr[i] = raw.charCodeAt(i);
          return arr;
        },
        subscribe: function (vapidPublicKey) {
          return window.sbPush._reg().then(function (reg) {
            return reg.pushManager.subscribe({
              userVisibleOnly: true,
              applicationServerKey: window.sbPush._urlB64ToUint8Array(vapidPublicKey),
            });
          }).then(function (sub) {
            return JSON.stringify(sub);
          });
        },
        getExisting: function () {
          return window.sbPush._reg()
            .then(function (reg) { return reg.pushManager.getSubscription(); })
            .then(function (sub) { return sub ? JSON.stringify(sub) : null; });
        },
        unsubscribe: function () {
          return window.sbPush._reg()
            .then(function (reg) { return reg.pushManager.getSubscription(); })
            .then(function (sub) {
              if (!sub) return null;
              const endpoint = sub.endpoint;
              return sub.unsubscribe().then(function () { return endpoint; });
            });
        },
      };

      // iOS PWA cache buster: when Flutter's SW finds an update (e.g. after
      // a GitHub-Pages redeploy), tell it to activate immediately and reload.
      // Without this, iOS Home-Screen PWAs can sit on a stale build for days.
      navigator.serviceWorker.ready.then(function (registration) {
        registration.update().catch(function () {});
        registration.addEventListener('updatefound', function () {
          const newWorker = registration.installing;
          if (!newWorker) return;
          newWorker.addEventListener('statechange', function () {
            if (newWorker.state === 'installed' &&
                navigator.serviceWorker.controller) {
              // A new SW is waiting — skip the wait + reload to pick it up.
              newWorker.postMessage({ type: 'SKIP_WAITING' });
              window.location.reload();
            }
          });
        });
      });

      // When the active SW changes (e.g. after skipWaiting), reload once.
      let refreshing = false;
      navigator.serviceWorker.addEventListener('controllerchange', function () {
        if (refreshing) return;
        refreshing = true;
        window.location.reload();
      });
    }
  </script>
</body>
</html>
